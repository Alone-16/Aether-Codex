name = "aether-codex"
main = "worker/index.js"
compatibility_date = "2026-07-01"
[site]
bucket = "./"
exclude = ["node_modules", ".git", ".wrangler", "playwright-report", "test-results", "tests", "*.mjs", "*.sql", "package*.json"]


[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "aether_codex_db"
database_id = "707efb23-2b15-4c56-95e3-3aaed94abb93"

# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "aether-codex-files-dev"

[env.preview]
vars = { ENVIRONMENT = "preview" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "aether_codex_db_preview"
database_id = "707efb23-2b15-4c56-95e3-3aaed94abb93"

# [[env.preview.r2_buckets]]
# binding = "BUCKET"
# bucket_name = "aether-codex-files-preview"

[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "aether_codex_db"
database_id = "707efb23-2b15-4c56-95e3-3aaed94abb93"

# [[env.production.r2_buckets]]
# binding = "BUCKET"
# bucket_name = "aether-codex-files-prod"


